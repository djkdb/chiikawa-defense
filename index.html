<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>치이카와 랜덤 디펜스</title>
<meta name="description" content="치이카와 친구들을 무작위로 소환하고 합성해서 길을 도는 작은 괴물을 막는 팬 디펜스 게임. 비영리 팬 게임 · 치이카와 © nagano · 공식과 관련 없음 · 캐릭터 그림은 팬 도트 시트.">
<meta name="theme-color" content="#bfe3ff">
<!-- 앱으로 설치 (PWA) — manifest · 아이콘은 tools/make_icons.py, 안내 · 서비스워커 등록은 js/inapp.js -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="랜덤 디펜스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="랜덤 디펜스">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%239fcf6a'/%3E%3Crect x='3' y='4' width='10' height='9' fill='%23fff'/%3E%3Crect x='4' y='3' width='2' height='2' fill='%23fff'/%3E%3Crect x='10' y='3' width='2' height='2' fill='%23fff'/%3E%3Crect x='5' y='7' width='1' height='2' fill='%232a2120'/%3E%3Crect x='10' y='7' width='1' height='2' fill='%232a2120'/%3E%3Crect x='4' y='9' width='2' height='1' fill='%23ffa0b4'/%3E%3Crect x='10' y='9' width='2' height='1' fill='%23ffa0b4'/%3E%3C/svg%3E">
<!-- 갈무리 (SIL OFL 1.1, © Lee Minseo) — 한글 도트 글꼴. 못 받으면 시스템 글꼴로 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="inapp.css">
<style>
:root{
  --ink:#4a3530; --paper:#ffffff; --sky-bg:#bfe3ff; --sky-bg-2:#e3f2ff; --mute:#9a7f6a;
  --yellow:#ffe08a; --yellow-d:#efbf4a; --pink:#ffc6d3; --pink-d:#f29ab0; --sky:#cfe7ff; --sky-d:#8fbbe8;
  --grass:#d4ecb4; --danger:#e8566b;
  --common:#b9ab9c; --rare:#5aa7ee; --epic:#ae78ee; --legend:#ffb428;
  --f:Galmuri11, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-b:Galmuri14, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:14px/1.5 var(--f); color:var(--ink);
  background:var(--sky-bg) radial-gradient(#a4d2f5 1.2px,transparent 1.4px) 0 0/18px 18px;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px dashed #2f7ad8;outline-offset:3px}

/* 노치 · 홈 막대 밑으로 들어가지 않게 (viewport-fit=cover) */
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
button{touch-action:manipulation}

/* 윗줄 */
.hud{width:100%;max-width:980px;display:flex;align-items:center;gap:6px}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:3px 9px;min-height:38px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(74,53,48,.25)}
.wave b{font:15px var(--f-b);white-space:nowrap}
.wave small{font-size:11px;color:var(--mute);white-space:nowrap}
.load{flex:1;min-width:0}
.load .bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden;min-width:40px}
.load .bar i{display:block;height:100%;width:0;background:#9dd67f;transition:width .2s,background .2s}
.load.warn .bar i{background:#ffbf48}
.load.hot .bar i{background:var(--danger)}
.load.hot{animation:shake .3s infinite}
.load span{font-size:12px;white-space:nowrap}
.coins b{font:16px var(--f-b);min-width:3ch}
.coins canvas{width:22px;height:22px;image-rendering:pixelated}
.chip{min-width:44px;justify-content:center;font-size:13px}
.hud .pill{min-height:44px}
.chip[aria-pressed="false"]{color:var(--mute);text-decoration:line-through}

/* 무대: 판 + 옆 판넬 (폰에선 위아래) */
.stage{flex:1;min-height:0;width:100%;max-width:980px;display:flex;gap:10px;align-items:flex-start;justify-content:center}
.boardWrap{position:relative;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#c9e5a6;box-shadow:0 5px 0 rgba(74,53,48,.28);flex:none;touch-action:none}
#board{display:block;touch-action:none}
.panel{width:300px;display:flex;flex-direction:column;gap:8px}

.card{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 rgba(74,53,48,.25)}
.info{display:flex;gap:8px;align-items:center;min-height:66px}
.info .por{width:52px;height:52px;flex:none;border-radius:10px;border:3px solid var(--common);background:#fff}
.info .txt{flex:1;min-width:0}
.info .nm{font:15px var(--f-b);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.info .gr{font-size:12px;padding:0 6px;border-radius:6px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.info .ds{font-size:12px;color:var(--mute);line-height:1.35}
.info .acts{display:flex;flex-direction:column;gap:4px}
.info .hint{font-size:12px;color:var(--mute);line-height:1.45}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:12px;background:var(--yellow);min-height:40px;padding:4px 10px;box-shadow:inset 0 -4px 0 var(--yellow-d),0 3px 0 rgba(74,53,48,.3);font:14px var(--f-b);white-space:nowrap}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--yellow-d),0 1px 0 rgba(74,53,48,.3)}
.btn[disabled]{filter:grayscale(.7);opacity:.55;cursor:default}
.btn.pink{background:var(--pink);box-shadow:inset 0 -4px 0 var(--pink-d),0 3px 0 rgba(74,53,48,.3)}
.btn.sky{background:var(--sky);box-shadow:inset 0 -4px 0 var(--sky-d),0 3px 0 rgba(74,53,48,.3)}
.btn.small{min-height:32px;font-size:12px;padding:2px 8px;border-radius:10px}
.btn.wide{width:100%}

.ctrl{display:flex;gap:8px;align-items:stretch}
#summonBtn{flex:1;min-height:76px;flex-direction:column;gap:0;font-size:20px;border-radius:16px}
#summonBtn .cost{display:flex;align-items:center;gap:3px;font-size:14px}
#summonBtn .cost canvas{width:18px;height:18px;image-rendering:pixelated}
#summonBtn.pulse{animation:pulse 1.2s infinite}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1.15}
.up{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 7px;min-height:35px;line-height:1.2;box-shadow:inset 0 -3px 0 var(--c,#ccc)}
.up b{font:12px var(--f-b);color:var(--ink)}
.up b i{font-style:normal;color:var(--c)}
.up span{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:2px}
.up span canvas{width:12px;height:12px;image-rendering:pixelated}
.up[disabled]{opacity:.55;cursor:default}
.up:active:not([disabled]){transform:translateY(1px)}
.side-links{display:flex;gap:6px}
.side-links .btn{flex:1}

.fan{font-size:11px;color:var(--mute);text-align:center;line-height:1.3;padding:0 4px}

/* 판 위에 뜨는 글 */
#banner{position:absolute;left:0;right:0;top:70%;text-align:center;pointer-events:none;font:26px var(--f-b);color:#fff;
  text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink);opacity:0}
#banner.go{animation:banner 1.8s ease-out}
#banner.boss{color:#ffd0dc}
#banner small{display:block;font:14px var(--f-b)}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;font-size:13px;white-space:normal;width:max-content;max-width:92%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:.92}

/* 덮개 화면 (시작 · 도감 · 끝 · 멈춤) */
.ov{position:fixed;inset:0;background:rgba(74,53,48,.42);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.sheet{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:16px 16px 14px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 6px 0 rgba(74,53,48,.35);text-align:center}
.sheet h1{font:28px/1.15 var(--f-b);margin:4px 0 2px;color:#fff;text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),0 6px 0 var(--yellow-d)}
.sheet h1 em{font-style:normal;color:var(--yellow)}
.sheet h2{font:18px var(--f-b);margin:6px 0}
.sheet p{margin:6px 0;line-height:1.55}
.sub{color:var(--mute);font-size:13px}
.parade{display:flex;justify-content:center;gap:2px;margin:10px 0 6px;flex-wrap:wrap}
.parade canvas{width:54px;height:54px;animation:bob 1.4s ease-in-out infinite}
.rules{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:13px}
.rules li{margin:3px 0}
.rules ol{margin:0;padding-left:20px}
.row-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.row-btns .btn{min-width:130px;min-height:48px;font-size:16px}
.rec{font-size:13px;color:var(--mute);margin-top:8px}
.notice{font-size:11px;line-height:1.45;margin-top:10px}
.codex{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left;margin:8px 0}
.codex>div{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 8px}
.codex>div>div{flex:1;min-width:0}
.codex canvas{width:48px;height:48px;flex:none}
.codex b{font:14px var(--f-b);display:block}
.codex span{font-size:12px;color:var(--mute);line-height:1.35;display:block}
body[data-lay="phone"] .codex{grid-template-columns:1fr}
table.grades{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.grades th,table.grades td{border:2px solid var(--ink);padding:3px 4px}
table.grades th{background:var(--sky-bg-2)}
.gname{color:#fff;border-radius:6px;padding:0 6px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}
.stats div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px}
.stats b{display:block;font:20px var(--f-b)}
.stats span{font-size:12px;color:var(--mute)}
.endpic{image-rendering:pixelated;width:180px;height:auto;display:block;margin:4px auto}

/* ── v2 UI 키트 ─────────────────────────────────────────────
   난이도 · 확률/행운/신화 버튼 · 3택 카드 · 행운 · 레시피 · 변수 칩은 전부 이 블록의 클래스와 --ui-* 값만 씁니다.
   나중에 치이카와 세계관 UI 그림(버튼·패널·탭·테두리)을 입힐 때 여기 값(배경 이미지 · border-image)만 바꾸면 됩니다. */
:root{
  --ui-panel:var(--paper); --ui-panel-2:#fff; --ui-line:var(--ink); --ui-radius:12px; --ui-radius-s:10px; --ui-bw:3px;
  --ui-shadow:0 3px 0 rgba(74,53,48,.25); --ui-on:#ffe98f; --ui-mute:var(--mute);
  --ui-gamble:#ffe3f0; --ui-gamble-line:#e86fa3; --ui-ok:#7ccf6a; --ui-warn:#e8566b;
  --ui-myth:linear-gradient(90deg,#ff7aa8,#ffb45a,#ffe36a,#8fe08a,#7cc4ff,#b48cff);
}
.ui-box,.diff,.tool,.rcard,.lrow,.recipe,.vchip{background:var(--ui-panel-2);border:var(--ui-bw) solid var(--ui-line);border-radius:var(--ui-radius);box-shadow:var(--ui-shadow)}
.wave{min-width:0}
.wcol{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.wave .next{color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:180px}
.info .odds{font-size:11px;color:var(--ui-mute)}
/* 난이도 */
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.diff{display:flex;flex-direction:column;gap:1px;padding:9px 12px;text-align:left;box-shadow:inset 0 -4px 0 var(--c),var(--ui-shadow)}
.diff b{font:15px var(--f-b);color:var(--c)}
.diff span{font-size:11px;color:var(--ui-mute);line-height:1.3}
.diff em{font-style:normal;font-size:11px}
.diff.on{background:var(--ui-on);outline:3px solid var(--c);outline-offset:1px}
.diff[disabled]{opacity:.5;cursor:default}
.vchips{display:flex;flex-direction:column;gap:4px;margin:4px 0;text-align:left}
.vchip{padding:3px 8px;font-size:12px;border-width:2px;box-shadow:none}
.vchip b{color:var(--ui-warn)}
/* 판넬 도구 셋 */
.tools3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:3px 7px;min-height:44px;line-height:1.2;border-radius:var(--ui-radius-s);text-align:left;position:relative}
.tool>b{font:12px var(--f-b)}
.tool .tc{font-size:11px;color:var(--ui-mute);display:flex;align-items:center;gap:2px}
.tool .tc canvas{width:12px;height:12px;image-rendering:pixelated}
.tool[disabled]{opacity:.55;cursor:default}
.tool:active:not([disabled]){transform:translateY(1px)}
.tool.glow{box-shadow:inset 0 -3px 0 var(--ui-ok),var(--ui-shadow)}
.tool.pulse{animation:pulse 1s infinite;background:var(--ui-gamble)}
.tool .dot{font-style:normal;background:var(--ui-warn);color:#fff;border-radius:8px;padding:0 5px;margin-left:3px}
.obar{display:flex;width:100%;height:5px;border:1px solid var(--ui-line);border-radius:3px;overflow:hidden;background:#fff}
.obar i{display:block;height:100%}
/* 3택 보상 */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rcard{display:flex;flex-direction:column;gap:4px;padding:14px 10px;min-height:130px;align-items:center;justify-content:center;text-align:center}
.rcard em{font-style:normal;font-size:11px;background:var(--ui-ok);color:#fff;border-radius:6px;padding:0 6px}
.rcard b{font:15px var(--f-b)}
.rcard span{font-size:12px;color:var(--ui-mute);line-height:1.35}
.rcard.gam{background:var(--ui-gamble);border-color:var(--ui-gamble-line)}
.rcard.gam em{background:var(--ui-gamble-line)}
.rcard:active{transform:translateY(2px)}
/* 행운 · 레시피 */
.luck{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 10px;box-shadow:inset 0 -3px 0 var(--c),var(--ui-shadow)}
.lrow .lp{flex:1;text-align:left;font:16px var(--f-b)}
.lmsg{min-height:1.4em;font-size:14px}
.recipes{display:flex;flex-direction:column;gap:6px;margin:8px 0;text-align:left}
.recipe{display:flex;gap:8px;padding:10px 12px;align-items:center}
.recipe.ready{background:var(--ui-gamble);border-color:var(--ui-gamble-line)}
.rhead{width:52px;height:52px;flex:none;border-radius:var(--ui-radius-s);border:3px solid transparent;background:var(--ui-myth) border-box;display:flex;align-items:center;justify-content:center;font:22px var(--f-b);color:#fff;overflow:hidden}
.rhead canvas{background:#fff;border-radius:6px}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rbody>b{font:14px var(--f-b)}
.rdesc{font-size:11px;color:var(--ui-mute);line-height:1.3}
.ings{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:12px}
.ings i{font-style:normal;color:var(--ui-mute)}
.ing{border:2px solid var(--ui-line);border-radius:6px;padding:0 4px;background:#fff}
.ing.have{background:#e2f6d5;border-color:var(--ui-ok)}
.ract{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ract small{font-size:11px;color:var(--ui-mute)}
ul.rules.mini{padding-left:22px;font-size:12px}
#banner.myth{color:#ffe3f0}
/* 배경 맵 (사람이 만든 그림, assets/bg/) — 판 뒤에 깔고 크림 막을 덮어 판넬 글이 읽히게 */
body.bg-day{background:linear-gradient(rgba(214,238,255,.3),rgba(214,238,255,.3)),url(assets/bg/day.webp) center/cover fixed,var(--sky-bg)}
body.bg-night{background:linear-gradient(rgba(20,26,60,.25),rgba(20,26,60,.25)),url(assets/bg/night.webp) center/cover fixed,#1d2b4a}
body.bg-night .fan{color:#e8e2ff;text-shadow:0 1px 2px #000}
.fan{background:var(--ui-fan-bg,transparent);border-radius:8px}
.cover{height:150px;margin:-6px -6px 6px;border-radius:14px;border:var(--ui-bw) solid var(--ui-line);background:url(assets/bg/cover.webp) center 54%/cover}
body[data-lay="phone"] .cover{height:110px}
.ic{display:inline-block;height:1.1em;width:auto;vertical-align:-.15em}
/* 컷인 · 손맛 (보스 등장 경고 띠 · 새 특성 띠 · 동전 칸 튕김) */
#cutin{position:absolute;left:-4%;right:-4%;top:34%;display:flex;align-items:center;gap:8px;padding:8px 6%;pointer-events:none;opacity:0;transform:skewY(-4deg)}
#cutin img{height:72px;width:auto;flex:none;filter:drop-shadow(0 2px 0 var(--ink))}
#cutin b{display:block;font:24px var(--f-b);color:#fff;text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink)}
#cutin small{display:block;font:12px var(--f-b);color:#fff;text-shadow:-1px 0 var(--ink),1px 0 var(--ink),0 -1px var(--ink),0 1px var(--ink)}
#cutin.boss{background:repeating-linear-gradient(-45deg,var(--ui-warn) 0 14px,#3a2540 14px 28px);border-block:4px solid #ffe36a}
#cutin.wave{background:linear-gradient(90deg,transparent,rgba(90,167,238,.92) 15%,rgba(90,167,238,.92) 85%,transparent)}
#cutin.go{animation:cutin 2.1s cubic-bezier(.2,.9,.3,1)}
@keyframes cutin{0%{opacity:0;transform:skewY(-4deg) translateX(-60%)}12%{opacity:1;transform:skewY(-4deg) translateX(0)}82%{opacity:1;transform:skewY(-4deg) translateX(0)}100%{opacity:0;transform:skewY(-4deg) translateX(40%)}}
.bump{animation:bump .28s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
body[data-lay="phone"] #cutin b{font-size:19px}body[data-lay="phone"] #cutin img{height:54px}
@media (prefers-reduced-motion:reduce){#cutin.go,.bump{animation:none}}

.card,.pill,.btn,.btn.pink,.btn.sky,#summonBtn,.up,.tool,.lrow,.diff,.diff[data-i='0'],.diff[data-i='1'],.diff[data-i='2'],.diff[data-i='3'],.rcard,.rcard.gam,.recipe,.recipe.ready,.rules{position:relative;isolation:isolate;background:none!important;border-color:transparent!important;box-shadow:none!important}

.parade canvas:nth-child(2n){animation-delay:-.35s}.parade canvas:nth-child(3n){animation-delay:-.7s}

/* ── 기기 배치 ── body[data-lay] 는 fit() 이 정함 (UA 안 씀): phone(<600) · tab(600~839 또는 세로로 긴 태블릿) · wide(가로 태블릿 · 노트북)
   phone: 판 위 · 버튼은 아래 엄지 영역 / tab: 큰 판 + 아래 두 단 판넬 / wide: 판 + 옆 판넬, 세로 768 에서도 스크롤 없이 */
.stage{flex:1;min-height:0}
body[data-lay="wide"] #app{justify-content:center}
body[data-lay="wide"] .stage{flex:none;align-items:stretch}
body[data-lay="wide"] .panel{width:340px;gap:10px}
body[data-lay="wide"] .info{min-height:96px}
body[data-lay="wide"] .up,body[data-lay="wide"] .tool{min-height:48px}
body[data-lay="phone"] #app,body[data-lay="tab"] #app{gap:5px}
body[data-lay="phone"] .hud,body[data-lay="tab"] .hud{gap:4px;flex-wrap:wrap}
body[data-lay="phone"] .load,body[data-lay="tab"] .load{order:9;flex-basis:100%;min-height:28px}
body[data-lay="phone"] .wave,body[data-lay="tab"] .wave{flex:1}
body[data-lay="phone"] .stage,body[data-lay="tab"] .stage{flex-direction:column;align-items:center;gap:6px}
body[data-lay="phone"] .panel{width:100%;gap:6px}
body[data-lay="phone"] .pill{padding:2px 6px;min-height:44px;border-width:2px;border-radius:10px}
body[data-lay="phone"] .wave b{font-size:13px}
body[data-lay="phone"] .wave small{font-size:10px}
body[data-lay="phone"] .load span{font-size:11px}
body[data-lay="phone"] .chip{min-width:44px;font-size:12px}
body[data-lay="phone"] .boardWrap{border-width:3px;border-radius:14px}
body[data-lay="phone"] .card{padding:5px 8px;border-radius:12px}
/* 고른 친구 설명이 길어져도 판넬 높이가 그대로여야 판·버튼이 밀리지 않음 (fit() 이 처음 높이로 판 크기를 정함) */
body[data-lay="phone"] .info{min-height:0;height:62px;overflow:hidden}
body[data-lay="phone"] .info .ds{font-size:11px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
body[data-lay="phone"] .info .hint{font-size:11px;line-height:1.35}
body[data-lay="phone"] .info .nm{font-size:14px}
body[data-lay="phone"] .info .por{width:40px;height:40px}
body[data-lay="phone"] .parade canvas{width:40px;height:40px}
body[data-lay="phone"] #summonBtn{min-height:96px}
body[data-lay="phone"] .up{min-height:45px}
body[data-lay="phone"] .tool{min-height:46px;padding:2px 6px}
body[data-lay="phone"] .tool>b{font-size:11px}
body[data-lay="phone"] .side-links{display:none}
body[data-lay="phone"] .fan{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
body[data-lay="phone"] .diffs{grid-template-columns:1fr 1fr}
body[data-lay="phone"] .wave .next{max-width:150px}
body[data-lay="phone"] .cards3{gap:5px}
body[data-lay="phone"] .rcard{padding:8px 4px;min-height:120px}
body[data-lay="phone"] .rcard b{font-size:13px}
body[data-lay="phone"] .rcard span{font-size:11px}
/* 태블릿 세로: 판넬을 두 단(왼쪽 = 설명 · 도구 / 오른쪽 = 소환 · 강화)으로 — 폰 화면을 늘린 것처럼 보이지 않게 */
body[data-lay="tab"] .panel{width:100%;max-width:760px;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"info ctrl" "tools ctrl" "links ctrl";gap:8px}
body[data-lay="tab"] .info{grid-area:info;min-height:84px}
body[data-lay="tab"] .ctrl{grid-area:ctrl}
body[data-lay="tab"] .tools3{grid-area:tools}
body[data-lay="tab"] .side-links{grid-area:links}
body[data-lay="tab"] #summonBtn{min-height:120px;font-size:24px}
body[data-lay="tab"] .up,body[data-lay="tab"] .tool{min-height:54px}
body[data-lay="tab"] .hud,body[data-lay="tab"] .stage{max-width:760px}
body[data-lay="tab"] .pill{min-height:46px}
/* 단축키 표시 — 넓은 배치 + 마우스가 있을 때만 */
kbd{display:none;font:10px var(--f);border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:5px;padding:0 4px;background:#fff;color:var(--ink);margin-left:4px;line-height:1.3}
@media (hover:hover) and (pointer:fine){ body[data-lay="wide"] kbd{display:inline-block} }
/* 눌림 · 호버 */
.pressed{transform:translateY(2px) scale(.97)!important;filter:brightness(.96)}
@media (hover:hover){ .btn:hover:not([disabled]),.tool:hover:not([disabled]),.up:hover:not([disabled]),button.pill:hover{filter:brightness(1.06)} .diff:hover:not([disabled]),.rcard:hover{transform:translateY(-2px)} }
/* 화면 전환: 덮개가 짧게 페이드 · 종이가 톡 */
.ov:not([hidden]){animation:ovIn .16s ease-out}
.ov:not([hidden]) .sheet{animation:sheetIn .2s cubic-bezier(.2,1.3,.4,1)}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:scale(.92) translateY(10px)}to{transform:none}}
.ov{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
/* 로딩 */
#loading{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--sky-bg);transition:opacity .3s}
#loading.done{opacity:0;pointer-events:none}
#loading b{font:22px var(--f-b)}
#loading .lbar{width:min(280px,70vw);height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
#loading .lbar i{display:block;height:100%;width:0;background:#9dd67f;transition:width .2s}
#loading p{margin:0;font-size:13px;color:var(--ink);max-width:80vw;text-align:center}
/* 처음 1회 안내 (판 위 말풍선 — 판 입력은 막지 않음). 판 가장자리는 전부 괴물 길이라 안쪽 아래(아래 길 한 줄 위)에 둠 — 괴물이 나오는 윗길을 가리지 않게 */
#coach{position:absolute;left:8px;right:8px;bottom:calc(var(--tile,48px) + 10px);z-index:3;display:flex;gap:8px;align-items:center;padding:8px 10px;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:var(--ui-shadow);font-size:13px;line-height:1.4;pointer-events:none}
#coach b{color:#2f7ad8}
#coach button{pointer-events:auto;flex:none;min-height:44px;min-width:64px;font-size:12px}
.coach-on{position:relative;z-index:1;animation:coachGlow 1s ease-in-out infinite}
@keyframes coachGlow{0%,100%{box-shadow:0 0 0 0 rgba(47,122,216,.0)}50%{box-shadow:0 0 0 5px rgba(47,122,216,.55)}}
/* 설정 */
.set{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.set label{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:14px}
.set input[type=checkbox]{width:24px;height:24px;accent-color:#2f7ad8}
.set select{font:inherit;min-height:36px;border:2px solid var(--ink);border-radius:8px;background:#fff}
#toast{pointer-events:auto;cursor:pointer}
/* 움직임 줄이기 (설정 · OS 설정) */
body.calm .parade canvas,body.calm #summonBtn.pulse,body.calm .load.hot,body.calm .tool.pulse,body.calm .coach-on{animation:none!important}
body.calm #cutin.go{animation:cutinCalm 2s linear}
@keyframes cutinCalm{0%,100%{opacity:0}10%,85%{opacity:1}}
@media (prefers-reduced-motion:reduce){ .parade canvas,#summonBtn.pulse,.load.hot{animation:none} }
/* 폰 · 판을 크게, 버튼은 얇게 (사람: 「폰에서 디펜스 화면이 너무 작고 버튼이 너무 커서 비효율적」)
   카카오톡 안 브라우저처럼 위아래 막대가 있으면 화면 세로가 650px 안팎 — 판에 최대한 주고, 조작은 아래 두 줄로 */
body[data-lay="phone"] #app{gap:4px}
body[data-lay="phone"] .hud{flex-wrap:wrap;gap:3px}
body[data-lay="phone"] .hud .pill{min-height:36px;--uk:0.42}
body[data-lay="phone"] .hud .chip{min-width:40px;padding:0 6px;font-size:12px}
body[data-lay="phone"] .wave{flex:1;min-width:0}
body[data-lay="phone"] .wave b{font-size:12px}
body[data-lay="phone"] .wave .wcol{display:none}
body[data-lay="phone"] .load{order:9;flex-basis:100%;min-height:22px!important;padding:0 8px}
body[data-lay="phone"] .load .bar{height:8px}
body[data-lay="phone"] .load span{font-size:10px}
body[data-lay="phone"] .panel{gap:4px}
body[data-lay="phone"] .info{height:auto;min-height:0;padding:3px 8px}
body[data-lay="phone"] .info .por{width:28px;height:28px;border-width:2px}
body[data-lay="phone"] .info .ds,body[data-lay="phone"] .info .hint{font-size:10.5px;-webkit-line-clamp:1;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
body[data-lay="phone"] .info .nm{font-size:12px}
body[data-lay="phone"] .ctrl{gap:5px}
body[data-lay="phone"] #summonBtn{min-height:52px;flex:0 0 31%;font-size:16px;--uk:0.45}
body[data-lay="phone"] #summonBtn kbd{display:none}
body[data-lay="phone"] .ups{grid-template-columns:repeat(4,1fr);gap:4px}
body[data-lay="phone"] .up{min-height:52px;padding:2px 4px;--uk:0.42}
body[data-lay="phone"] .up b{font-size:11px}
body[data-lay="phone"] .up span{font-size:10px}
body[data-lay="phone"] .tools3{gap:4px}
body[data-lay="phone"] .tool{min-height:40px;padding:1px 6px;--uk:0.42;flex-direction:row;align-items:center;justify-content:space-between;gap:4px}
body[data-lay="phone"] .tool kbd,body[data-lay="phone"] .tool .obar{display:none}
body[data-lay="phone"] .tool>b{font-size:11px}
body[data-lay="phone"] .tool .tc{font-size:10.5px}
body[data-lay="phone"] .fan{display:none}
body[data-lay="phone"] .boardWrap{border-width:3px}
body[data-lay="phone"] #mythBtn .tc{display:none}
body[data-lay="phone"] .tool>b{white-space:nowrap}
body[data-lay="phone"] .ups{grid-template-columns:repeat(4,minmax(0,1fr))}
body[data-lay="phone"] .up b{font-size:10.5px;line-height:1.15;word-break:keep-all}
body[data-lay="phone"] .tool{min-width:0}
</style>

<body>
<div id="app">
  <header class="hud">
    <div class="pill wave"><b id="waveTxt">웨이브 0/20</b><span class="wcol"><small id="waveT"></small><small id="nextTxt" class="next"></small></span></div>
    <div class="pill load" id="loadBox"><div class="bar"><i id="loadBar"></i></div><span id="loadTxt">0/40</span></div>
    <div class="pill coins" title="동전 — 괴물을 잡으면 받아요"><canvas id="coinIco" width="12" height="12"></canvas><b id="coinTxt">0</b></div>
    <button class="pill chip" id="spdBtn" aria-label="빠르기">×1<kbd>F</kbd></button>
    <button class="pill chip" id="setBtn" aria-label="설정 (소리 · 음악 · 진동 · 움직임)">설정</button>
    <button class="pill chip" id="pauseBtn" aria-label="멈춤">멈춤<kbd>P</kbd></button>
  </header>

  <main class="stage">
    <div class="boardWrap" id="boardWrap">
      <canvas id="board" aria-label="게임 판 — 친구를 눌러 고르고, 같은 친구·같은 등급끼리 끌어다 놓으면 합성"></canvas>
      <div id="banner"></div>
      <div id="cutin" aria-live="polite"></div>
      <div id="toast" role="status"></div>
      <div id="coach" hidden></div>
    </div>
    <aside class="panel">
      <div class="card info" id="info"></div>
      <div class="ctrl">
        <button class="btn" id="summonBtn"><span>소환<kbd>Space</kbd></span><span class="cost"><canvas width="12" height="12"></canvas><b id="costTxt">20</b></span></button>
        <div class="ups" id="ups"></div>
      </div>
      <div class="tools3">
