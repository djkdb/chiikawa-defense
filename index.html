<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>치이카와 랜덤 디펜스</title>
<meta name="description" content="치이카와 친구들을 무작위로 소환하고 합성해서 길을 도는 작은 괴물을 막는 팬 디펜스 게임. 비영리 팬 게임 · 치이카와 © nagano · 공식과 관련 없음 · 캐릭터 그림은 팬 도트 시트.">
<meta name="theme-color" content="#fff1d6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23f4ddb2'/%3E%3Crect x='3' y='4' width='10' height='9' fill='%23fff'/%3E%3Crect x='4' y='3' width='2' height='2' fill='%23fff'/%3E%3Crect x='10' y='3' width='2' height='2' fill='%23fff'/%3E%3Crect x='5' y='7' width='1' height='2' fill='%232a2120'/%3E%3Crect x='10' y='7' width='1' height='2' fill='%232a2120'/%3E%3Crect x='4' y='9' width='2' height='1' fill='%23ffa0b4'/%3E%3Crect x='10' y='9' width='2' height='1' fill='%23ffa0b4'/%3E%3C/svg%3E">
<!-- 갈무리 (SIL OFL 1.1, © Lee Minseo) — 한글 도트 글꼴. 못 받으면 시스템 글꼴로 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{
  --ink:#4a3530; --paper:#fffaf0; --cream:#fff1d6; --cream-2:#fbe6c2; --mute:#9a7f6a;
  --yellow:#ffe08a; --yellow-d:#efbf4a; --pink:#ffc6d3; --pink-d:#f29ab0; --sky:#cfe7ff; --sky-d:#8fbbe8;
  --grass:#d4ecb4; --danger:#e8566b;
  --common:#b9ab9c; --rare:#5aa7ee; --epic:#ae78ee; --legend:#ffb428;
  --f:Galmuri11, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-b:Galmuri14, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:14px/1.5 var(--f); color:var(--ink);
  background:var(--cream) radial-gradient(#efd7ae 1.2px,transparent 1.4px) 0 0/18px 18px;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px dashed #2f7ad8;outline-offset:3px}

#app{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:8px 8px 4px;gap:6px}

/* 윗줄 */
.hud{width:100%;max-width:980px;display:flex;align-items:center;gap:6px}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:3px 9px;min-height:38px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(74,53,48,.25)}
.wave b{font:15px var(--f-b);white-space:nowrap}
.wave small{font-size:11px;color:var(--mute);white-space:nowrap}
.load{flex:1;min-width:0}
.load .bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden;min-width:40px}
.load .bar i{display:block;height:100%;width:0;background:#9dd67f;transition:width .2s,background .2s}
.load.warn .bar i{background:#ffbf48}
.load.hot .bar i{background:var(--danger)}
.load.hot{animation:shake .3s infinite}
.load span{font-size:12px;white-space:nowrap}
.coins b{font:16px var(--f-b);min-width:3ch}
.coins canvas{width:22px;height:22px;image-rendering:pixelated}
.chip{min-width:40px;justify-content:center;font-size:13px}
.chip[aria-pressed="false"]{color:var(--mute);text-decoration:line-through}

/* 무대: 판 + 옆 판넬 (폰에선 위아래) */
.stage{flex:1;min-height:0;width:100%;max-width:980px;display:flex;gap:10px;align-items:flex-start;justify-content:center}
.boardWrap{position:relative;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#c9e5a6;box-shadow:0 5px 0 rgba(74,53,48,.28);flex:none;touch-action:none}
#board{display:block;touch-action:none}
.panel{width:300px;display:flex;flex-direction:column;gap:8px}

.card{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 rgba(74,53,48,.25)}
.info{display:flex;gap:8px;align-items:center;min-height:66px}
.info .por{width:52px;height:52px;flex:none;border-radius:10px;border:3px solid var(--common);background:#fff}
.info .txt{flex:1;min-width:0}
.info .nm{font:15px var(--f-b);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.info .gr{font-size:12px;padding:0 6px;border-radius:6px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.info .ds{font-size:12px;color:var(--mute);line-height:1.35}
.info .acts{display:flex;flex-direction:column;gap:4px}
.info .hint{font-size:12px;color:var(--mute);line-height:1.45}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:12px;background:var(--yellow);min-height:40px;padding:4px 10px;box-shadow:inset 0 -4px 0 var(--yellow-d),0 3px 0 rgba(74,53,48,.3);font:14px var(--f-b);white-space:nowrap}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--yellow-d),0 1px 0 rgba(74,53,48,.3)}
.btn[disabled]{filter:grayscale(.7);opacity:.55;cursor:default}
.btn.pink{background:var(--pink);box-shadow:inset 0 -4px 0 var(--pink-d),0 3px 0 rgba(74,53,48,.3)}
.btn.sky{background:var(--sky);box-shadow:inset 0 -4px 0 var(--sky-d),0 3px 0 rgba(74,53,48,.3)}
.btn.small{min-height:32px;font-size:12px;padding:2px 8px;border-radius:10px}
.btn.wide{width:100%}

.ctrl{display:flex;gap:8px;align-items:stretch}
#summonBtn{flex:1;min-height:76px;flex-direction:column;gap:0;font-size:20px;border-radius:16px}
#summonBtn .cost{display:flex;align-items:center;gap:3px;font-size:14px}
#summonBtn .cost canvas{width:18px;height:18px;image-rendering:pixelated}
#summonBtn.pulse{animation:pulse 1.2s infinite}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1.15}
.up{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 7px;min-height:35px;line-height:1.2;box-shadow:inset 0 -3px 0 var(--c,#ccc)}
.up b{font:12px var(--f-b);color:var(--ink)}
.up b i{font-style:normal;color:var(--c)}
.up span{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:2px}
.up span canvas{width:12px;height:12px;image-rendering:pixelated}
.up[disabled]{opacity:.55;cursor:default}
.up:active:not([disabled]){transform:translateY(1px)}
.side-links{display:flex;gap:6px}
.side-links .btn{flex:1}

.fan{font-size:11px;color:var(--mute);text-align:center;line-height:1.3;padding:0 4px}

/* 판 위에 뜨는 글 */
#banner{position:absolute;left:0;right:0;top:70%;text-align:center;pointer-events:none;font:26px var(--f-b);color:#fff;
  text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink);opacity:0}
#banner.go{animation:banner 1.8s ease-out}
#banner.boss{color:#ffd0dc}
#banner small{display:block;font:14px var(--f-b)}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:.92}

/* 덮개 화면 (시작 · 도감 · 끝 · 멈춤) */
.ov{position:fixed;inset:0;background:rgba(74,53,48,.42);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.sheet{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:16px 16px 14px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 6px 0 rgba(74,53,48,.35);text-align:center}
.sheet h1{font:28px/1.15 var(--f-b);margin:4px 0 2px;color:#fff;text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),0 6px 0 var(--yellow-d)}
.sheet h1 em{font-style:normal;color:var(--yellow)}
.sheet h2{font:18px var(--f-b);margin:6px 0}
.sheet p{margin:6px 0;line-height:1.55}
.sub{color:var(--mute);font-size:13px}
.parade{display:flex;justify-content:center;gap:2px;margin:10px 0 6px;flex-wrap:wrap}
.parade canvas{width:54px;height:54px;animation:bob 1.4s ease-in-out infinite}
.rules{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:13px}
.rules li{margin:3px 0}
.rules ol{margin:0;padding-left:20px}
.row-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.row-btns .btn{min-width:130px;min-height:48px;font-size:16px}
.rec{font-size:13px;color:var(--mute);margin-top:8px}
.notice{font-size:11px;line-height:1.45;margin-top:10px}
.codex{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left;margin:8px 0}
.codex>div{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 8px}
.codex>div>div{flex:1;min-width:0}
.codex canvas{width:48px;height:48px;flex:none}
.codex b{font:14px var(--f-b);display:block}
.codex span{font-size:12px;color:var(--mute);line-height:1.35;display:block}
@media (max-width:760px){.codex{grid-template-columns:1fr}}
table.grades{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.grades th,table.grades td{border:2px solid var(--ink);padding:3px 4px}
table.grades th{background:var(--cream-2)}
.gname{color:#fff;border-radius:6px;padding:0 6px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}
.stats div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px}
.stats b{display:block;font:20px var(--f-b)}
.stats span{font-size:12px;color:var(--mute)}
.endpic{image-rendering:pixelated;width:180px;height:auto;display:block;margin:4px auto}

@keyframes banner{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.parade canvas:nth-child(2n){animation-delay:-.35s}.parade canvas:nth-child(3n){animation-delay:-.7s}

/* 폰 (세로) */
@media (max-width:760px){
  #app{padding:6px 6px 2px;gap:5px}
  .hud{gap:4px;flex-wrap:wrap}
  .load{order:9;flex-basis:100%;min-height:26px}
  .wave{flex:1}
  .pill{padding:2px 6px;min-height:34px;border-width:2px;border-radius:10px}
  .wave b{font-size:13px}
  .wave small{font-size:10px}
  .load span{font-size:11px}
  .chip{min-width:34px;font-size:12px}
  .stage{flex-direction:column;align-items:center;gap:6px}
  .boardWrap{border-width:3px;border-radius:14px}
  .panel{width:100%;gap:6px}
  .card{padding:5px 8px;border-radius:12px}
  /* 고른 친구 설명이 길어져도 판넬 높이가 그대로여야 판·버튼이 밀리지 않음 (fit() 이 처음 높이로 판 크기를 정함) */
  .info{min-height:0;height:84px;overflow:hidden}
  .info .ds{font-size:11px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .info .nm{font-size:14px}
  .info .por{width:44px;height:44px}
  .parade canvas{width:40px;height:40px}
  #summonBtn{min-height:70px}
  .side-links{display:none}
  .fan{font-size:10px}
}
/* 데스크톱: 판이 ×2 상한이라 화면이 남으므로 가운데로 */
@media (min-width:761px){ #app{justify-content:center} .stage{flex:none} }
@media (prefers-reduced-motion:reduce){ .parade canvas,#summonBtn.pulse,.load.hot{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="pill wave"><b id="waveTxt">웨이브 0/20</b><small id="waveT"></small></div>
    <div class="pill load" id="loadBox"><div class="bar"><i id="loadBar"></i></div><span id="loadTxt">0/40</span></div>
    <div class="pill coins" title="동전 — 괴물을 잡으면 받아요"><canvas id="coinIco" width="12" height="12"></canvas><b id="coinTxt">0</b></div>
    <button class="pill chip" id="spdBtn" aria-label="빠르기">×1</button>
    <button class="pill chip" id="sndBtn" aria-pressed="true" aria-label="소리 켜고 끄기">소리</button>
    <button class="pill chip" id="pauseBtn" aria-label="멈춤">멈춤</button>
  </header>

  <main class="stage">
    <div class="boardWrap" id="boardWrap">
      <canvas id="board" aria-label="게임 판 — 친구를 눌러 고르고, 같은 친구·같은 등급끼리 끌어다 놓으면 합성"></canvas>
      <div id="banner"></div>
      <div id="toast"></div>
    </div>
    <aside class="panel">
      <div class="card info" id="info"></div>
      <div class="ctrl">
        <button class="btn" id="summonBtn"><span>소환</span><span class="cost"><canvas width="12" height="12"></canvas><b id="costTxt">20</b></span></button>
        <div class="ups" id="ups"></div>
      </div>
      <div class="side-links"><button class="btn sky small" id="codexBtn2">도감 · 규칙</button></div>
    </aside>
  </main>
  <footer class="fan">비영리 팬 게임 · 치이카와 © nagano · 공식과 관련 없음 · 캐릭터 그림은 팬이 만든 도트 시트(공식 그림 아님)</footer>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="js/table.js"></script>
<script src="assets/chars/chars.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/sfx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
